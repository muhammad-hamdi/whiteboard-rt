<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voidboard</title>
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/main.js" type="module"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="overlay">
        <div class="brand">
            <div class="title">Voidboard</div>
            <div class="subtitle">realtime whiteboard experiment</div>
            <div class="subtitle" id="room">Room Id: </div>
            <div class="subtitle" id="peers"># of peers: </div>
        </div>

        <div class="toolbar">
            <button class="tool" id="select" title="Select (In Development LOL)" disabled>
                <i class="hgi hgi-stroke hgi-rounded hgi-cursor-01"></i>
            </button>
            <button class="tool" id="drag" title="Drag">
                <i class="hgi hgi-stroke hgi-rounded hgi-hand-grab"></i>
            </button>
            <button class="tool active" id="brush" title="Pen">
                <i class="hgi hgi-stroke hgi-rounded hgi-pen-01"></i>
            </button>
            <button class="tool" id="rect" title="Rectangle">
                <i class="hgi hgi-stroke hgi-rounded hgi-square"></i>
            </button>
            <button class="tool" id="circle" title="Circle">
                <i class="hgi hgi-stroke hgi-rounded hgi-circle"></i>
            </button>
            <button class="tool" id="line" title="Line">
                <i class="hgi hgi-stroke hgi-rounded hgi-liner"></i>
            </button>
            <button class="tool" id="path" title="Path (Multiple points, press Esc to cancel)">
                <i class="hgi hgi-stroke hgi-rounded hgi-spline-pointer"></i>
            </button>

            <div class="color-picker-wrapper">
                <button class="tool color-tool" id="colorBtn" title="Pick Color">
                    <span class="color-preview" id="colorPreview"></span>
                    <i class="hgi hgi-stroke hgi-rounded hgi-colors"></i>
                </button>

                <div class="color-popup" id="colorPopup">
                    <button class="color-swatch" data-color="#1e1e1e" style="background:#1e1e1e"></button>
                    <button class="color-swatch" data-color="#ff4d4d" style="background:#ff4d4d"></button>
                    <button class="color-swatch" data-color="#4dff88" style="background:#4dff88"></button>
                    <button class="color-swatch" data-color="#4da6ff" style="background:#4da6ff"></button>
                    <button class="color-swatch" data-color="#ffd24d" style="background:#ffd24d"></button>
                    <button class="color-swatch" data-color="#c084fc" style="background:#c084fc"></button>

                    <!-- Native color picker -->
                    <!--<input type="color" id="nativeColorPicker" value="#1e1e1e">-->
                </div>
            </div>
        </div>

        <div class="help">
            <div><kbd>C</kbd> copy room URL</div>
            <div><kbd>1</kbd> Pen</div>
            <div><kbd>2</kbd> Rect</div>
            <div><kbd>3</kbd> Circle</div>
            <div><kbd>4</kbd> Line</div>
            <div><kbd>5</kbd> Path, multiple points <kbd>Esc</kbd> to cancel</div>
            <div><kbd>LeftCtrl</kbd> Hold to move viewport</div>
        </div>

        <div class="alert" id="alert"></div>
    </div>
</body>
</html>
